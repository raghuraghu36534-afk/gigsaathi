spring.application.name=gigsaathi

# PostgreSQL Database - Use environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gigsaathi}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:changeme}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=true

# Server port
server.port=${PORT:8080}
