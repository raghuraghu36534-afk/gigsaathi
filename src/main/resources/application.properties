spring.application.name=gigsaathi

# PostgreSQL Database - Use environment variables with fallback for local development
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gigsaathi}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Raghu*1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=true

# Server port
server.port=${PORT:8080}
