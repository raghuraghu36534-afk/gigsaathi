<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GigSaathi - Register</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #eef2ff;
            color: #172033;
            overflow-x: hidden;
        }

        /* =========================
           ANIMATED BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background:
                    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.20), transparent 30%),
                    radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.18), transparent 30%),
                    #f8fafc;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }

        .blob-one {
            width: 260px;
            height: 260px;
            background: #818cf8;
            top: -80px;
            left: -80px;
        }

        .blob-two {
            width: 220px;
            height: 220px;
            background: #38bdf8;
            bottom: -60px;
            right: -50px;
            animation-delay: 2s;
        }

        .blob-three {
            width: 140px;
            height: 140px;
            background: #a78bfa;
            top: 45%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.05);
            }
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            position: sticky;
            top: 0;
            z-index: 10;

            animation: slideDown 0.7s ease;
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-main {
            color: #4f46e5;
        }

        .logo-second {
            color: #111827;
        }


        .nav-badge {
            padding: 8px 14px;
            border-radius: 30px;

            background: rgba(79, 70, 229, 0.08);
            color: #4f46e5;

            font-size: 13px;
            font-weight: 600;
        }


        /* =========================
           MAIN
           ========================= */

        .container {
            max-width: 1150px;
            margin: 55px auto;
            padding: 0 25px;

            animation: pageAppear 0.9s ease;
        }

        @keyframes pageAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           HEADER
           ========================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 35px;
        }


        .title-section h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1.5px;

            margin-bottom: 8px;
        }


        .title-section p {
            color: #64748b;
            font-size: 15px;
        }


        /* =========================
           CARD
           ========================= */

        .card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                    0 20px 50px rgba(15, 23, 42, 0.08);

            animation: cardAppear 1s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        .card-header {
            padding: 22px 28px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .card-header h2 {
            font-size: 18px;
        }


        /* =========================
           FORM
           ========================= */

        .form-container {
            padding: 30px 28px;
        }


        .form-group {
            margin-bottom: 24px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #475569;
        }


        .form-group input {
            width: 100%;

            padding: 12px 16px;

            border: 1px solid #e2e8f0;

            border-radius: 10px;

            font-size: 14px;

            background: rgba(255, 255, 255, 0.9);

            transition: all 0.25s ease;
        }


        .form-group input:focus {
            outline: none;

            border-color: #4f46e5;

            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }


        .form-group input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           BUTTONS
           ========================= */

        .button-group {
            display: flex;
            gap: 12px;

            margin-top: 32px;
        }


        .submit-button {
            flex: 1;

            background: #4f46e5;
            color: white;

            padding: 14px 24px;

            border: none;

            border-radius: 12px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);

            transition: all 0.25s ease;
        }


        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.35);
            background: #4338ca;
        }


        .cancel-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: rgba(255, 255, 255, 0.8);
            color: #4f46e5;

            padding: 14px 24px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            border: 1px solid rgba(79, 70, 229, 0.2);

            transition: all 0.25s ease;
        }


        .cancel-button:hover {
            background: rgba(79, 70, 229, 0.1);
            border-color: rgba(79, 70, 229, 0.4);
        }


        /* =========================
           FOOTER
           ========================= */

        .footer {
            text-align: center;

            margin-top: 35px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-badge {
                display: none;
            }

            .container {
                margin: 30px auto;
                padding: 0 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .title-section h1 {
                font-size: 30px;
            }

            .button-group {
                flex-direction: column;
            }

            .submit-button,
            .cancel-button {
                width: 100%;
                justify-content: center;
            }
        }

    </style>

</head>


<body>

<!-- Animated Background -->

<div class="background">

    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div class="blob blob-three"></div>

</div>


<!-- Navigation -->

<nav class="navbar">

    <div class="logo">

        <span class="logo-main">Gig</span><span class="logo-second">Saathi</span>

    </div>

    <div class="nav-badge">
        Registration
    </div>

</nav>


<!-- Main -->

<div class="container">


    <!-- Header -->

    <div class="page-header">

        <div class="title-section">

            <h1>Create Account</h1>

            <p>
                Join GigSaathi to manage your gig income
            </p>

        </div>

    </div>


    <!-- Form Card -->

    <div class="card">


        <div class="card-header">

            <h2>
                User Registration
            </h2>


            <div style="font-size: 12px; color: #64748b;">
                Fill in your details
            </div>

        </div>


        <div class="form-container">

            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           placeholder="Enter your name"
                           required>

                </div>


                <div class="form-group">

                    <label for="phoneNumber">
                        Phone Number
                    </label>

                    <input type="text"
                           id="phoneNumber"
                           th:field="*{phoneNumber}"
                           placeholder="Enter your phone number"
                           required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="Create a password"
                           required>

                </div>


                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input type="number"
                           id="age"
                           th:field="*{age}"
                           placeholder="Enter your age"
                           min="18"
                           max="100"
                           required>

                </div>


                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <input type="text"
                           id="state"
                           th:field="*{state}"
                           placeholder="Enter your state"
                           required>

                </div>


                <div class="button-group">

                    <button type="submit" class="submit-button">
                        Register
                    </button>

                    <a href="/login" class="cancel-button">
                        Already have an account? Login
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- Footer -->

    <div class="footer">

        © 2026 GigSaathi · Connecting People, Creating Opportunities

    </div>


</div>

</body>

</html>
