<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GigSaathi - Users</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #eef2ff;
            color: #172033;
            overflow-x: hidden;
        }

        /* =========================
           ANIMATED BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background:
                    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.20), transparent 30%),
                    radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.18), transparent 30%),
                    #f8fafc;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }

        .blob-one {
            width: 260px;
            height: 260px;
            background: #818cf8;
            top: -80px;
            left: -80px;
        }

        .blob-two {
            width: 220px;
            height: 220px;
            background: #38bdf8;
            bottom: -60px;
            right: -50px;
            animation-delay: 2s;
        }

        .blob-three {
            width: 140px;
            height: 140px;
            background: #a78bfa;
            top: 45%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.05);
            }
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            position: sticky;
            top: 0;
            z-index: 10;

            animation: slideDown 0.7s ease;
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-main {
            color: #4f46e5;
        }

        .logo-second {
            color: #111827;
        }


        .nav-badge {
            padding: 8px 14px;
            border-radius: 30px;

            background: rgba(79, 70, 229, 0.08);
            color: #4f46e5;

            font-size: 13px;
            font-weight: 600;
        }


        /* =========================
           MAIN
           ========================= */

        .container {
            max-width: 1150px;
            margin: 55px auto;
            padding: 0 25px;

            animation: pageAppear 0.9s ease;
        }

        @keyframes pageAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           HEADER
           ========================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 35px;
        }


        .title-section h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1.5px;

            margin-bottom: 8px;
        }


        .title-section p {
            color: #64748b;
            font-size: 15px;
        }


        /* =========================
           ADD BUTTON
           ========================= */

        .add-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: #4f46e5;
            color: white;

            padding: 13px 20px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);

            transition: all 0.25s ease;
        }


        .add-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.35);
            background: #4338ca;
        }


        .plus {
            font-size: 20px;
            line-height: 0;
        }


        /* =========================
           STATS
           ========================= */

        .stats {
            display: flex;
            gap: 18px;
            margin-bottom: 25px;
        }


        .stat-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 16px;

            padding: 20px 25px;

            min-width: 190px;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);

            transition: 0.3s ease;
        }


        .stat-card:hover {
            transform: translateY(-4px);
        }


        .stat-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }


        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #4f46e5;
        }


        /* =========================
           USER CARD
           ========================= */

        .card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                    0 20px 50px rgba(15, 23, 42, 0.08);

            animation: cardAppear 1s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        .card-header {
            padding: 22px 28px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .card-header h2 {
            font-size: 18px;
        }


        .online {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 12px;
            color: #64748b;
        }


        .online-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #22c55e;

            animation: pulse 1.8s infinite;
        }


        @keyframes pulse {

            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }


        /* =========================
           TABLE
           ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
        }


        thead {
            background: rgba(248, 250, 252, 0.8);
        }


        th {
            text-align: left;

            padding: 15px 28px;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #94a3b8;
        }


        th:last-child {
            text-align: center;
        }


        .actions {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: color 0.25s ease;
        }


        .actions:hover {
            color: #4338ca;
            text-decoration: underline;
        }


        td {
            padding: 17px 28px;

            border-top: 1px solid #f1f5f9;

            font-size: 14px;
        }


        td:last-child {
            text-align: center;
        }


        tbody tr {
            transition: box-shadow 0.25s ease;

            animation: rowAppear 0.5s ease both;

            transform-style: preserve-3d;
            will-change: transform;
        }


        tbody tr:nth-child(1) {
            animation-delay: 0.1s;
        }

        tbody tr:nth-child(2) {
            animation-delay: 0.2s;
        }

        tbody tr:nth-child(3) {
            animation-delay: 0.3s;
        }

        tbody tr:nth-child(4) {
            animation-delay: 0.4s;
        }

        tbody tr:nth-child(5) {
            animation-delay: 0.5s;
        }


        @keyframes rowAppear {

            from {
                opacity: 0;
                transform: translateX(-15px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        tbody tr.tilt-active {
            transition: transform 0.1s ease-out;
            background: #f8faff;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.12);
        }


        /* =========================
           USER PROFILE
           ========================= */

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #4f46e5;

            color: white;

            font-weight: 800;
            font-size: 15px;

            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.2);
        }


        .user-name {
            font-weight: 700;
            color: #1e293b;
        }


        .user-id {
            color: #94a3b8;
            font-weight: 600;
        }


        .phone {
            color: #475569;
        }


        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 10px;

            border-radius: 20px;

            background: #ecfdf5;

            color: #15803d;

            font-size: 11px;

            font-weight: 700;
        }


        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22c55e;
        }


        .actions {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: color 0.25s ease;
        }


        .actions:hover {
            color: #4338ca;
            text-decoration: underline;
        }


        /* =========================
           FOOTER
           ========================= */

        .footer {
            text-align: center;

            margin-top: 35px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-badge {
                display: none;
            }

            .container {
                margin: 30px auto;
                padding: 0 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .title-section h1 {
                font-size: 30px;
            }

            .add-button {
                width: 100%;
                justify-content: center;
            }

            .stats {
                width: 100%;
            }

            .stat-card {
                width: 100%;
            }

            .card {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }

    </style>

</head>


<body>

<!-- Animated Background -->

<div class="background">

    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div class="blob blob-three"></div>

</div>


<!-- Navigation -->

<nav class="navbar">

    <div class="logo">

        <span class="logo-main">Gig</span><span class="logo-second">Saathi</span>

    </div>

    <div class="nav-badge">
        User Management
    </div>

</nav>


<!-- Main -->

<div class="container">


    <!-- Header -->

    <div class="page-header">

        <div class="title-section">

            <h1>Users</h1>

            <p>
                Manage your GigSaathi community
            </p>

        </div>


        <div style="display: flex; gap: 12px;">

            <div style="display: flex; align-items: center; gap: 8px; color: #64748b; font-size: 14px; font-weight: 600;">
                Welcome, <span th:text="${#authentication.name}">user</span>
            </div>

            <form th:action="@{/logout}" method="post" style="display: inline;">

                <button type="submit" class="add-button" style="background: #64748b; box-shadow: 0 8px 20px rgba(100, 116, 139, 0.25); cursor: pointer; border: none; font-size: 14px; font-weight: 700; color: white; padding: 13px 20px; border-radius: 12px;">
                    Logout
                </button>

            </form>

        </div>

    </div>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Users
            </div>

            <div class="stat-number"
                 th:text="${#lists.size(users)}">
                0
            </div>

        </div>

    </div>


    <!-- Users -->

    <div class="card">


        <div class="card-header">

            <h2>
                Registered Users
            </h2>


            <div class="online">

                <span class="online-dot"></span>

                System Active

            </div>

        </div>


        <table>

            <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    User
                </th>

                <th>
                    Phone Number
                </th>

                <th>
                    Status
                </th>

                <th>
                    Actions
                </th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="user : ${users}">

                <td class="user-id">
                    #<span th:text="${user.id}">1</span>
                </td>


                <td>

                    <div class="user-info">

                        <div class="avatar"
                             th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">
                            R
                        </div>

                        <div class="user-name"
                             th:text="${user.name}">
                            Ravi
                        </div>

                    </div>

                </td>


                <td class="phone"
                    th:text="${user.phoneNumber}">
                    9008443879
                </td>


                <td>

                    <span class="status">

                        <span class="status-dot"></span>

                        Active

                    </span>

                </td>


                <td>

                    <a th:href="@{/users/{id}/earnings(id=${user.id})}"
                       class="actions">
                        View Earnings
                    </a>

                </td>

            </tr>


            </tbody>

        </table>

    </div>


    <!-- Footer -->

    <div class="footer">

        © 2026 GigSaathi · Connecting People, Creating Opportunities

    </div>


</div>

<script>
    // Animated count-up for stat numbers
    document.querySelectorAll('.stat-number').forEach(el => {
        const target = parseInt(el.textContent.trim(), 10) || 0;
        let current = 0;
        const duration = 1200; // ms
        const stepTime = Math.max(Math.floor(duration / (target || 1)), 20);

        const counter = setInterval(() => {
            current++;
            el.textContent = current;
            if (current >= target) {
                clearInterval(counter);
                el.textContent = target;
            }
        }, stepTime);
    });

    // 3D tilt effect on table rows following the mouse
    document.querySelectorAll('tbody tr').forEach(row => {
        row.addEventListener('mousemove', (e) => {
            const rect = row.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * 3;   // tilt strength
            const rotateY = ((x - centerX) / centerX) * -3;

            row.classList.add('tilt-active');
            row.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
        });

        row.addEventListener('mouseleave', () => {
            row.classList.remove('tilt-active');
            row.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) scale(1)';
        });
    });
</script>

</body>

</html>
